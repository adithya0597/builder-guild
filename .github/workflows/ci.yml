name: ci

# Minimum-useful CI (not vanity): catch the manifest/runnability regression class on a
# clean clone, and gate the ingest/write engine + dead-edge instrument against a real Neo4j.
# NOTE (uti): read-path pure+graph gates ARE now run in the graph job (scope/epist/abstain/gate/
# stamp/reconcile + recall & retention self-tests). The embedding-backed retrieval demos
# (embed/ladder-INT2/fuse/sweep) need a vector seed and are the next increment. serve-INT3
# (F6: provenance-escaping fail-closed self-test + serve-join wiring, INT3_OK) IS gated below.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # least privilege — CI needs no write scope

jobs:
  smoke:
    # No DB. The high-value gate: does the repo install + import from its own manifest,
    # and do the DB-free contract demos pass? (This is the class b4fb829 / 7fa8de9 fixed.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: import smoke (all top-level modules in src + tools dirs)
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          dirs = [d for d in ("01-context/src", "02-agents/src", "03-evals/src", "tools") if pathlib.Path(d).is_dir()]
          for d in dirs:
              sys.path.insert(0, d)
          mods = sorted({p.stem for d in dirs for p in pathlib.Path(d).glob("*.py") if p.stem != "__init__"})
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  bad.append(f"{m}: {type(e).__name__}: {e}")
          print(f"imported {len(mods) - len(bad)}/{len(mods)}")
          if bad:
              print("FAILED:", *bad, sep="\n  ")
              sys.exit(1)
          PY
      - name: DB-free contract demos
        run: |
          python 01-context/src/evidence.py | tee /tmp/evidence.log
          grep -q EVIDENCE_OK /tmp/evidence.log
          python 01-context/src/pageindex_adapter.py | tee /tmp/pageindex.log
          grep -q PAGEINDEX_ADAPTER_OK /tmp/pageindex.log
      - name: write-gateway gate (crk — reject handwritten current-edge writes outside mutate.apply_edge)
        run: |
          python tools/check_write_gateway.py | tee /tmp/gateway.log
          grep -q WRITE_GATEWAY_OK /tmp/gateway.log
          grep -q WRITE_IMPORTS_OK /tmp/gateway.log
      - name: eval acceptance gate (jxn — fold-in of jb5's test_g3 G3_OK [now incl. eval_planner P1-P5 via test h] + judge-absent CAL1_SKIP)
        run: |
          python 03-evals/src/test_g3.py | tee /tmp/g3.log
          grep -q G3_OK /tmp/g3.log
          JUDGE_CMD=/nonexistent/bin/judge python 03-evals/src/judge_adapter.py | tee /tmp/judge.log
          grep -q CAL1_SKIP /tmp/judge.log

  graph:
    # Real Neo4j. Gates the ingest/write engine + invariant backstops: seed schema -> spine ingest
    # + node-card read-back -> mutate/namespace-isolation -> dead-edge metric -> single-current +
    # cycle detection sweeps (each with a self-test) -> sentinel migration guard -> read-path gates
    # (scope/epist/abstain/gate/stamp/reconcile + recall & retention self-tests, uti). The
    # embedding-backed retrieval demos (ladder-INT2/serve-INT3/fuse/sweep) are the next increment.
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/companybrain
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p companybrain 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: seed schema (constraints + rel_invalid_at index)
        run: python tools/apply_cypher.py 01-context/schema/01_constraints.cypher 01-context/schema/03_indexes.cypher
      - name: spine + engine truth demos
        run: |
          python 01-context/src/etl.py | tee /tmp/etl.log
          grep -q D1_SPINE_OK /tmp/etl.log
          python 01-context/src/mutate.py | tee /tmp/mutate.log
          grep -q E1_MUT_OK /tmp/mutate.log
          python 01-context/src/deadedge_metrics.py | tee /tmp/deadedge.log
          grep -q DEADEDGE_METRICS_OK /tmp/deadedge.log
          python 01-context/src/invariant_check.py | tee /tmp/invariant.log
          grep -q SINGLE_CURRENT_OK /tmp/invariant.log
          python 01-context/src/invariant_check.py --self-test | tee /tmp/invariant_st.log
          grep -q INVARIANT_SELFTEST_OK /tmp/invariant_st.log
          python 01-context/src/cycle_check.py | tee /tmp/cycle.log
          grep -q CYCLE_CHECK_OK /tmp/cycle.log
          python 01-context/src/cycle_check.py --self-test | tee /tmp/cycle_st.log
          grep -q CYCLE_SELFTEST_OK /tmp/cycle_st.log
          python tools/run_guard.py 01-context/schema/07_sentinel_migration.cypher | tee /tmp/guard.log
          grep -q GUARD_OK /tmp/guard.log
          python tools/run_guard.py --self-test | tee /tmp/guard_st.log
          grep -q GUARD_SELFTEST_OK /tmp/guard_st.log
      - name: read-path gates (uti — scope/epist/abstain/gate/stamp/reconcile + recall & retention self-tests)
        run: |
          python 01-context/src/scope.py | tee /tmp/scope.log
          grep -q F3_SCOPE_OK /tmp/scope.log
          python 01-context/src/epist.py | tee /tmp/epist.log
          grep -q EPIST_OK /tmp/epist.log
          python 01-context/src/abstain.py | tee /tmp/abstain.log
          grep -q FIX_ABSTAIN_OK /tmp/abstain.log
          python 01-context/src/gate.py | tee /tmp/gate.log
          grep -q GATE_OK /tmp/gate.log
          python 01-context/src/stamp.py | tee /tmp/stamp.log
          grep -q F4_STAMP_OK /tmp/stamp.log
          python 01-context/src/reconcile.py | tee /tmp/reconcile.log
          grep -q FIX_RECON_OK /tmp/reconcile.log
          python 01-context/src/ladder.py --recall-selftest | tee /tmp/recall.log
          grep -q RECALL_SELFTEST_OK /tmp/recall.log
          python 01-context/src/retention_sweep.py --selftest | tee /tmp/retention.log
          grep -q RETENTION_SELFTEST_OK /tmp/retention.log
      - name: staging gate (7mg — candidate-stage + approval gate; promote() writes only through mutate.apply_edge)
        run: |
          python 01-context/src/staging.py --selftest | tee /tmp/staging.log
          grep -q STAGING_OK /tmp/staging.log
      - name: race gates (485 — promote() CAS under concurrency + sibling apply_edge write-lock gate)
        run: |
          python 01-context/src/race_test.py | tee /tmp/race.log
          grep -q FIX_RACE_OK /tmp/race.log
          python 01-context/src/staging_race_test.py | tee /tmp/staging_race.log
          grep -q STAGING_RACE_OK /tmp/staging_race.log
      - name: history ingest gate (22w — hermetic selftest fixtures, needs no engram.db)
        run: |
          python 01-context/src/etl_history.py --selftest | tee /tmp/etl_history.log
          grep -q HISTORY_INGEST_OK /tmp/etl_history.log
      - name: mcp gate (9fe — read-only stdio MCP surface over serve(); mcp==1.28.1 already in requirements.txt)
        run: |
          python 02-agents/src/selftest_mcp.py | tee /tmp/mcp.log
          grep -q MCP_SERVE_OK /tmp/mcp.log
      - name: rollback gate (b9y — namespace-scoped rollback + orphaned candidate sweep; no unscoped wipes)
        run: |
          python 01-context/src/rollback.py --selftest | tee /tmp/rollback.log
          grep -q ROLLBACK_OK /tmp/rollback.log
      - name: G1 eval gates (jxn — eval_planner PLANNER_TESTS_OK+PLANNER_OK; eval_corrective CORRECTIVE_OK)
        run: |
          python 03-evals/src/eval_planner.py | tee /tmp/eval_planner.log
          grep -q PLANNER_TESTS_OK /tmp/eval_planner.log
          grep -q PLANNER_OK /tmp/eval_planner.log
          python 03-evals/src/eval_corrective.py | tee /tmp/eval_corrective.log
          grep -q CORRECTIVE_OK /tmp/eval_corrective.log
      - name: G1 agent gates (jxn — demo_agent DEMO_AGENT_OK; stage-mcp selftest STAGE_MCP_OK)
        run: |
          python 02-agents/src/demo_agent.py | tee /tmp/demo_agent.log
          grep -q DEMO_AGENT_OK /tmp/demo_agent.log
          BG_MCP_ROLE=engineering BG_STAGE_NS=engineering python 02-agents/src/selftest_stage_mcp.py | tee /tmp/stage_mcp.log
          grep -q STAGE_MCP_OK /tmp/stage_mcp.log
      - name: serve-INT3 gate (F6 — provenance-escaping fail-closed self-test, _src_class default + forged-tag escape, plus serve-join wiring)
        run: |
          python 01-context/src/serve.py demo | tee /tmp/serve_demo.log
          grep -q INT3_OK /tmp/serve_demo.log
