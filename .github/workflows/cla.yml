name: cla

# CLA gate (CONTRIBUTING.md "Licensing & contributor agreement"): contributor-assistant/
# github-action posts a sign-request comment on a contributor's first PR and records the
# signature as a commit on a dedicated, unprotected branch in THIS repo (no PAT, no remote
# repo — default github.token only). Two triggers per the action's own docs: the sign/recheck
# comment, and the PR lifecycle itself. Neither trigger checks out or runs PR code — the only
# step is the action invocation, so a PR from an untrusted fork never gets code execution.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write         # required by the action to look up/update its own check run
  contents: write        # commits the signature file to the cla-signatures branch
  pull-requests: write   # posts/updates the sign-request comment, sets PR status
  statuses: write        # sets the CLA pass/fail status check on the PR

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event_name == 'issue_comment' && github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        # v2.6.1 pinned by commit SHA — the tag's actual release commit (verified via
        # `gh api repos/contributor-assistant/github-action/git/refs/tags/v2.6.1`).
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/adithya0597/builder-guild/blob/main/CLA.md"
          branch: "cla-signatures" # dedicated, unprotected — main has required reviews
          allowlist: adithya0597,dependabot[bot],github-actions[bot]
