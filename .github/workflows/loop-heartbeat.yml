name: loop-heartbeat

# Scheduled dead-man's-switch for the daily-triage loop. A scheduled workflow cannot
# detect its OWN non-execution, so this separate cron watches the DURABLE evidence
# (loops/daily-triage/run-log.md, which exists on v3 — NOT the triage workflow, which
# doesn't yet) and raises ONE issue when no run has been logged within cadence + grace.
# It HONORS the kill switch (vars.LOOP_PAUSE_ALL): when loops are paused on purpose a
# missed run is EXPECTED, so the heartbeat must not cry wolf — a monitor skipping while
# paused is correct, not a gate hole. The staleness decision lives in a pure-bash
# SYNC-REGION kept byte-identical to the local test (mirror of classify.yml).

on:
  schedule:
    - cron: '17 15 * * *'   # runs 6h after the 09:17 triage cadence
  workflow_dispatch:

permissions: {}             # least privilege by default; the job opts into what it needs

concurrency:
  group: loop-heartbeat     # serialize cron + manual dispatch so two runs can't both create the issue
  cancel-in-progress: false

jobs:
  heartbeat:
    # Kill-switch HONORED (opposite of the merge gates): missed runs are expected when paused.
    if: vars.LOOP_PAUSE_ALL != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read          # read the run-log
      issues: write           # raise / resolve the alert
    steps:
      - name: checkout (run-log is the durable evidence)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: alert if loop-triage missed its run
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: '33'   # 24h cadence + 9h grace: tolerates one late/jittery run, fires on sustained death (~54h next day)
        run: |
          set -euo pipefail
          # heartbeat: SYNC-REGION-BEGIN (extracted verbatim by the local staleness test — keep PURE: grep/sort/awk/arithmetic only, no date/gh/runtime deps)
          newest_valid_run_id() {
            # arg $1: max acceptable ISO-8601-Z (now + small skew). stdin: run-log text.
            # stdout: newest ISO-Z run_id that is <= max, empty if none. ISO-Z sorts lexically ==
            # chronologically, so we FILTER future stamps OUT (awk $0<=max, string compare) BEFORE
            # sort|tail. That's the fix: a typo/clock-skew far-future stamp can never become the
            # freshness basis — the newest GENUINE (past) stamp wins, so a dead loop with a stray
            # future entry still reads STALE. (Also filters future-month typos like 2026-13-.. since
            # they lexically exceed max.) Fail-safe: future noise cannot suppress an alert.
            local max="$1"
            grep -oE '"run_id": *"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z"' \
              | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z' \
              | awk -v max="$max" 'length($0) && $0 <= max' \
              | sort | tail -1 || true
          }
          stale_by_age() {
            # args: <newest_epoch|empty> <now_epoch> <max_age_hours>. exit 0 = STALE, 1 = fresh.
            # empty newest (no parseable/valid entry) => STALE — fail-safe: silence must not read as healthy.
            local newest_epoch="$1" now="$2" max_h="$3"
            [ -n "$newest_epoch" ] || return 0
            [ "$(( now - newest_epoch ))" -gt "$(( max_h * 3600 ))" ] && return 0
            return 1
          }
          # heartbeat: SYNC-REGION-END

          RUNLOG='loops/daily-triage/run-log.md'
          MARKER='<!-- loop-heartbeat -->'
          TITLE='⏰ loop-triage: missed run'

          now_epoch="$(date -u +%s)"
          # Max acceptable stamp = now + 5min skew. NTP'd GitHub runners differ by seconds; anything
          # further ahead is a typo/clock bug and must NOT count as "the loop just ran". Future stamps
          # are filtered here so the newest GENUINE past stamp drives the decision.
          max_iso="$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          if [ -f "$RUNLOG" ]; then
            newest="$(newest_valid_run_id "$max_iso" < "$RUNLOG")"
          else
            newest=''            # file vanished -> treat as missed (fail-safe), don't crash the monitor
          fi

          newest_epoch=''
          if [ -n "$newest" ]; then
            # newest is already <= now+skew (future filtered above). Only guard a lexically-valid but
            # calendar-invalid stamp (e.g. day 32, hour 99) from crashing date under set -e -> empty -> STALE.
            if ! newest_epoch="$(date -u -d "$newest" +%s 2>/dev/null)"; then
              echo "heartbeat: newest run_id '${newest}' unparseable -> treating as missed" >&2
              newest=''; newest_epoch=''
            fi
          fi

          # One lookup, reused by whichever branch fires. update-not-spam: list open issues and let the
          # jq marker filter be the SOLE authority (no --search, so GitHub's tokenizer can't drop a
          # marker'd issue and cause a duplicate) — mirror of classify.yml's list+contains() idiom.
          existing="$(gh issue list --state open --limit 200 --json number,body \
                        --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].number // empty")"

          if stale_by_age "$newest_epoch" "$now_epoch" "$MAX_AGE_HOURS"; then
            if [ -n "$newest" ]; then
              age_h="$(( (now_epoch - newest_epoch) / 3600 ))"
              detail="Newest logged run: \`${newest}\` — ${age_h}h old (threshold ${MAX_AGE_HOURS}h)."
            else
              detail="No valid (parseable, non-future) run_id in ${RUNLOG}."
            fi
            body="$(
              printf '%s\n\n' "$MARKER"
              printf '**loop-triage appears to have missed a run.**\n\n'
              printf '%s\n\n' "$detail"
              printf 'If loops are intentionally paused, set repo var LOOP_PAUSE_ALL=true and this monitor stands down.\n'
            )"
            if [ -n "$existing" ]; then
              printf '%s' "$body" | gh issue comment "$existing" --body-file -
              echo "updated existing heartbeat issue #${existing}"
            else
              printf '%s' "$body" | gh issue create --title "$TITLE" --body-file -
            fi
          else
            if [ -n "$existing" ]; then
              recovered="$(
                printf '%s\n\n' "$MARKER"
                printf 'Recovered — newest run `%s` is within the %sh threshold. Auto-closing.\n' "$newest" "$MAX_AGE_HOURS"
              )"
              printf '%s' "$recovered" | gh issue comment "$existing" --body-file -
              gh issue close "$existing"
              echo "closed recovered heartbeat issue #${existing}"
            else
              echo "fresh: newest run ${newest} within ${MAX_AGE_HOURS}h; no open heartbeat issue."
            fi
          fi
